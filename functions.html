<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>常用函数动态实验室</title>
<style>
:root{--bg:#f4f7fb;--text:#172033;--muted:#667085;--line:#d8e1eb;--accent:#2563eb;--second:#f97316;--shadow:0 8px 26px rgba(18,38,65,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}button{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-weight:650;color:var(--text);cursor:pointer}button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=number],select{min-height:36px;border:1px solid var(--line);border-radius:9px;padding:5px 7px;background:#fff;color:var(--text)}input[type=number]{width:82px}
.page{min-height:100vh;min-height:100dvh;padding:10px;display:grid;grid-template-columns:390px minmax(0,1fr);gap:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.side{padding:15px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:auto}.stage{padding:12px;min-height:650px;display:flex;align-items:flex-start}
.back{display:inline-block;text-decoration:none;color:var(--accent);font-size:12px;font-weight:700;margin-bottom:9px}.title{font-size:20px;margin:0 0 5px}.sub{font-size:11px;line-height:1.6;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.tabs button{font-size:11px;padding:6px 4px}
.functionBox{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px;margin-top:10px;background:#fff}.functionBox.second{border-left-color:var(--second);background:#fffaf7}
.functionHead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:7px}.functionHead select{width:150px;font-size:12px}.toggle{display:flex;align-items:center;gap:6px;font-weight:750;cursor:pointer}.toggle input{width:17px;height:17px;accent-color:var(--second)}
.formula{font-size:17px;font-weight:800;padding:8px 9px;border-radius:9px;background:#f8fafc;border:1px solid var(--line);overflow-wrap:anywhere}.second .formula{color:#c2410c;background:#fff7ed}
.param{margin:9px 0}.ph{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px}.pair{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:7px;align-items:center}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.stat{padding:8px;border:1px solid var(--line);border-radius:10px;background:#f9fbfd;min-height:60px}.stat b{display:block;font-size:13px;line-height:1.35}.stat span{font-size:10px;color:var(--muted)}
.intersections{margin-top:10px;padding:9px 10px;border:1px solid #fecaca;border-radius:10px;background:#fff7f7}.intersections b{font-size:12px;color:#b91c1c}.intersections div{font-size:11px;line-height:1.55;color:#7f1d1d;margin-top:3px}
.note{font-size:11px;line-height:1.6;color:var(--muted);padding:8px;border:1px solid #edf1f5;background:#f8fafc;border-radius:10px;margin-top:9px}
#graph{width:100%;height:auto;aspect-ratio:16/10;background:#fbfdff;border:1px solid var(--line);border-radius:12px;display:block}[hidden]{display:none!important}
@media(max-width:900px){.page{grid-template-columns:340px minmax(0,1fr)}}@media(max-width:760px){.page{display:flex;flex-direction:column;padding:8px}.stage{order:1;min-height:0}.side{order:2;max-height:none}.tabs{grid-template-columns:repeat(3,1fr)}button{min-height:44px}input[type=number],select{font-size:16px}.functionHead select{width:145px}}
</style>
</head>
<body>
<div class="page">
<aside class="panel side">
<a class="back" href="./">← 返回实验室</a>
<h1 class="title">常用函数动态实验室</h1>
<div class="sub">函数 1 与函数 2 可同时绘制并自动标注交点。二次函数采用顶点式，h、k 可直接控制水平与垂直平移。</div>
<div class="tabs" id="tabs">
<button data-type="linear">一次</button><button data-type="quadratic" class="active">二次</button><button data-type="inverse">反比例</button>
<button data-type="abs">绝对值</button><button data-type="exp">指数</button><button data-type="log">对数</button>
</div>
<section class="functionBox">
<div class="functionHead"><span>函数 1（蓝色）</span><span>主函数</span></div>
<div class="formula" id="formula1">y₁ = x²</div><div id="params1"></div>
</section>
<section class="functionBox second">
<div class="functionHead">
<label class="toggle"><input id="showSecond" type="checkbox" checked>函数 2（橙色）</label>
<select id="secondType" aria-label="选择函数2类型"><option value="linear">一次函数</option><option value="quadratic">二次函数</option><option value="inverse">反比例函数</option><option value="abs">绝对值函数</option><option value="exp">指数函数</option><option value="log">对数函数</option></select>
</div>
<div id="secondBody"><div class="formula" id="formula2">y₂ = x</div><div id="params2"></div></div>
</section>
<div class="tools"><button id="reset">恢复默认</button><button id="random">随机参数</button></div>
<div class="stats">
<div class="stat"><b id="p1">—</b><span id="l1">性质 1</span></div><div class="stat"><b id="p2">—</b><span id="l2">性质 2</span></div>
<div class="stat"><b id="p3">—</b><span id="l3">性质 3</span></div><div class="stat"><b id="p4">—</b><span id="l4">性质 4</span></div>
</div>
<div class="intersections"><b>函数交点</b><div id="intersectionList">正在计算…</div></div>
<div class="note" id="note">调整参数观察函数变化。</div>
</aside>
<section class="panel stage"><canvas id="graph" width="1200" height="750" aria-label="函数坐标图"></canvas></section>
</div>
<script src="./functions-lab.js"></script>
</body>
</html>
