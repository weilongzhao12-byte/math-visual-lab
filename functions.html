<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>常用函数动态实验室</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d8e1eb;--accent:#2563eb;--shadow:0 8px 26px rgba(18,38,65,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-weight:650;color:var(--text);cursor:pointer}button.active{background:var(--accent);color:#fff;border-color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}input[type=number]{width:88px;min-height:38px;border:1px solid var(--line);border-radius:9px;padding:5px 7px}.page{min-height:100vh;padding:10px;display:grid;grid-template-columns:315px minmax(0,1fr);gap:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.side{padding:16px}.stage{padding:12px;min-height:650px}.back{display:inline-block;text-decoration:none;color:var(--accent);font-size:12px;font-weight:700;margin-bottom:10px}.title{font-size:20px;margin:0 0 5px}.sub{font-size:11px;line-height:1.6;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}.tabs button{font-size:11px;padding:7px 5px}.formula{font-size:21px;font-weight:800;padding:10px 11px;border-radius:11px;background:#f8fafc;border:1px solid var(--line);overflow-wrap:anywhere}.param{margin:11px 0}.ph{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px}.pair{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px;align-items:center}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:9px;border:1px solid var(--line);border-radius:11px;background:#f9fbfd;min-height:62px}.stat b{display:block;font-size:14px}.stat span{font-size:10px;color:var(--muted)}.note{font-size:11px;line-height:1.6;color:var(--muted);padding:8px;border:1px solid #edf1f5;background:#f8fafc;border-radius:10px;margin-top:10px}#graph{width:100%;height:auto;aspect-ratio:16/10;background:#fbfdff;border:1px solid var(--line);border-radius:12px;display:block}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:760px){.page{display:flex;flex-direction:column;padding:8px}.stage{order:1;min-height:0}.side{order:2}.tabs{grid-template-columns:repeat(3,1fr)}button{min-height:44px}input[type=number]{font-size:16px}}
</style></head><body><div class="page"><aside class="panel side"><a class="back" href="./index.html">← 返回实验室</a><h1 class="title">常用函数动态实验室</h1><div class="sub">一次、二次、反比例、绝对值、指数、对数函数统一探索。滑杆与自定义输入框双向联动。</div><div class="tabs" id="tabs"><button data-type="linear">一次</button><button data-type="quadratic" class="active">二次</button><button data-type="inverse">反比例</button><button data-type="abs">绝对值</button><button data-type="exp">指数</button><button data-type="log">对数</button></div><div class="formula" id="formula">y = x²</div><div id="params"></div><div class="tools"><button id="reset">恢复默认</button><button id="random">随机参数</button></div><div class="stats"><div class="stat"><b id="p1">—</b><span id="l1">性质 1</span></div><div class="stat"><b id="p2">—</b><span id="l2">性质 2</span></div><div class="stat"><b id="p3">—</b><span id="l3">性质 3</span></div><div class="stat"><b id="p4">—</b><span id="l4">性质 4</span></div></div><div class="note" id="note">二次函数支持直接输入 a、b、c，也可拖动滑杆观察抛物线连续变化。</div></aside><section class="panel stage"><canvas id="graph" width="1200" height="750"></canvas></section></div><script>
(()=>{const $=id=>document.getElementById(id),canvas=$('graph'),ctx=canvas.getContext('2d');const X=10,Y=10;let type='quadratic';const configs={linear:{label:'一次函数',params:{k:{v:1,min:-5,max:5,step:.1},b:{v:0,min:-8,max:8,step:.1}}},quadratic:{label:'二次函数',params:{a:{v:1,min:-3,max:3,step:.1},b:{v:0,min:-6,max:6,step:.1},c:{v:0,min:-8,max:8,step:.1}}},inverse:{label:'反比例函数',params:{k:{v:4,min:-10,max:10,step:.1}}},abs:{label:'绝对值函数',params:{a:{v:1,min:-4,max:4,step:.1},h:{v:0,min:-6,max:6,step:.1},k:{v:0,min:-6,max:6,step:.1}}},exp:{label:'指数函数',params:{a:{v:1,min:-4,max:4,step:.1},b:{v:2,min:.2,max:4,step:.1},c:{v:0,min:-6,max:6,step:.1}}},log:{label:'对数函数',params:{a:{v:1,min:-4,max:4,step:.1},b:{v:2,min:.2,max:5,step:.1},h:{v:0,min:-5,max:5,step:.1},k:{v:0,min:-6,max:6,step:.1}}}};let values={};function fmt(v){if(!Number.isFinite(v))return'—';if(Math.abs(v)<1e-9)return'0';return(+v.toFixed(2)).toString()}function sx(x){return canvas.width/2+x*canvas.width/(2*X)}function sy(y){return canvas.height/2-y*canvas.height/(2*Y)}
function initValues(){values={};for(const[k,p]of Object.entries(configs[type].params))values[k]=p.v}
function buildParams(){const box=$('params');box.innerHTML='';for(const[key,p]of Object.entries(configs[type].params)){const d=document.createElement('div');d.className='param';d.innerHTML=`<div class="ph"><b>${key}</b><span id="${key}Text">${fmt(values[key])}</span></div><div class="pair"><input id="${key}Range" type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${values[key]}"><input id="${key}Num" type="number" min="${p.min}" max="${p.max}" step="${p.step}" value="${values[key]}"></div>`;box.appendChild(d);const r=d.querySelector('input[type=range]'),n=d.querySelector('input[type=number]');r.addEventListener('input',()=>{values[key]=+r.value;n.value=r.value;draw()});n.addEventListener('input',()=>{let v=+n.value;if(!Number.isFinite(v))return;v=Math.max(p.min,Math.min(p.max,v));values[key]=v;r.value=v;draw()})}}
function fn(x){const v=values;if(type==='linear')return v.k*x+v.b;if(type==='quadratic')return v.a*x*x+v.b*x+v.c;if(type==='inverse')return Math.abs(x)<1e-6?NaN:v.k/x;if(type==='abs')return v.a*Math.abs(x-v.h)+v.k;if(type==='exp')return v.a*Math.pow(v.b,x)+v.c;if(type==='log')return x>v.h&&v.b>0&&Math.abs(v.b-1)>.03?v.a*(Math.log(x-v.h)/Math.log(v.b))+v.k:NaN;return NaN}
function formula(){const v=values;if(type==='linear')return`y = ${fmt(v.k)}x ${v.b>=0?'+':'−'} ${fmt(Math.abs(v.b))}`;if(type==='quadratic')return`y = ${fmt(v.a)}x² ${v.b>=0?'+':'−'} ${fmt(Math.abs(v.b))}x ${v.c>=0?'+':'−'} ${fmt(Math.abs(v.c))}`;if(type==='inverse')return`y = ${fmt(v.k)} / x`;if(type==='abs')return`y = ${fmt(v.a)}|x ${v.h>=0?'−':'+'} ${fmt(Math.abs(v.h))}| ${v.k>=0?'+':'−'} ${fmt(Math.abs(v.k))}`;if(type==='exp')return`y = ${fmt(v.a)}·${fmt(v.b)}ˣ ${v.c>=0?'+':'−'} ${fmt(Math.abs(v.c))}`;return`y = ${fmt(v.a)}·log₍${fmt(v.b)}₎(x ${v.h>=0?'−':'+'} ${fmt(Math.abs(v.h))}) ${v.k>=0?'+':'−'} ${fmt(Math.abs(v.k))}`}
function setStats(items,note){for(let i=0;i<4;i++){const it=items[i]||['—',''];$('p'+(i+1)).textContent=it[0];$('l'+(i+1)).textContent=it[1]}$('note').textContent=note}
function properties(){const v=values;if(type==='linear'){setStats([[v.k>0?'递增':v.k<0?'递减':'常量','单调性'],[`(0, ${fmt(v.b)})`,'与 y 轴交点'],[Math.abs(v.k)>1e-9?`x = ${fmt(-v.b/v.k)}`:'—','零点'],[fmt(v.k),'斜率 k']],'改变 k 观察倾斜方向与陡峭程度；改变 b 观察图像上下平移。')}else if(type==='quadratic'){if(Math.abs(v.a)<1e-8){setStats([['退化为一次函数','当前状态'],['—','顶点'],['—','对称轴'],['—','判别式']],'a=0 时不再是二次函数；可直接在 a 输入框中改回非零值。');return}const vx=-v.b/(2*v.a),vy=fn(vx),D=v.b*v.b-4*v.a*v.c;setStats([[`(${fmt(vx)}, ${fmt(vy)})`,'顶点'],[`x = ${fmt(vx)}`,'对称轴'],[v.a>0?'向上':'向下','开口方向'],[fmt(D),'判别式 Δ']],'a、b、c 均可滑动或直接输入数值。观察参数与顶点、对称轴、零点之间的关系。')}else if(type==='inverse'){setStats([[v.k>0?'Ⅰ、Ⅲ象限':v.k<0?'Ⅱ、Ⅳ象限':'x轴','主要分布'],['x = 0','竖直渐近线'],['y = 0','水平渐近线'],[fmt(v.k),'比例系数 k']],'反比例函数在 x=0 处没有定义，图像分成两支双曲线。')}else if(type==='abs'){setStats([[`(${fmt(v.h)}, ${fmt(v.k)})`,'顶点'],[v.a>0?'开口向上':v.a<0?'开口向下':'水平','方向'],[`x = ${fmt(v.h)}`,'对称轴'],[fmt(Math.abs(v.a)),'陡峭程度']],'绝对值函数呈 V 形；h、k 控制顶点位置，a 控制方向和陡峭程度。')}else if(type==='exp'){setStats([[v.b>1?'随 x 增大而放大':v.b<1?'随 x 增大而衰减':'退化','底数作用'],[`y = ${fmt(v.c)}`,'水平渐近线'],[`(0, ${fmt(v.a+v.c)})`,'y轴交点'],[fmt(v.b),'底数 b']],'指数函数要求 b>0 且 b≠1；当 b 接近1时图像变化会变得很缓。')}else{setStats([[`x > ${fmt(v.h)}`,'定义域'],[`x = ${fmt(v.h)}`,'竖直渐近线'],[v.b>1?'递增趋势':'递减趋势','底数作用'],[fmt(v.b),'底数 b']],'对数函数要求 b>0 且 b≠1，并且真数 x−h 必须大于0。')}}
function axes(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#e5eaf1';ctx.lineWidth=1;for(let x=-X;x<=X;x++){ctx.beginPath();ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),canvas.height);ctx.stroke()}for(let y=-Y;y<=Y;y++){ctx.beginPath();ctx.moveTo(0,sy(y));ctx.lineTo(canvas.width,sy(y));ctx.stroke()}ctx.strokeStyle='#475569';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(canvas.width,sy(0));ctx.moveTo(sx(0),0);ctx.lineTo(sx(0),canvas.height);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='18px system-ui';for(let x=-8;x<=8;x+=2)if(x)ctx.fillText(x,sx(x)+4,sy(0)+22);for(let y=-8;y<=8;y+=2)if(y)ctx.fillText(y,sx(0)+7,sy(y)-4)}
function draw(){for(const k of Object.keys(values)){const t=$(k+'Text');if(t)t.textContent=fmt(values[k])}$('formula').textContent=formula();axes();ctx.strokeStyle='#2563eb';ctx.lineWidth=5;ctx.beginPath();let open=false,lastY=null;for(let px=0;px<=canvas.width;px+=2){const x=(px-canvas.width/2)*2*X/canvas.width,y=fn(x),py=sy(y);const valid=Number.isFinite(y)&&Math.abs(y)<Y*3&&py>-canvas.height*2&&py<canvas.height*3;const jump=lastY!==null&&Math.abs(y-lastY)>Y*1.2;if(valid&&!jump){if(!open){ctx.moveTo(px,py);open=true}else ctx.lineTo(px,py)}else open=false;lastY=valid?y:null}ctx.stroke();properties()}
function choose(t){type=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));initValues();buildParams();draw()}document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.type)));$('reset').onclick=()=>choose(type);$('random').onclick=()=>{const cfg=configs[type].params;for(const[k,p]of Object.entries(cfg)){let v=p.min+Math.random()*(p.max-p.min);if((type==='exp'||type==='log')&&k==='b'&&Math.abs(v-1)<.25)v=2;if(type==='inverse'&&k==='k'&&Math.abs(v)<.4)v=3;values[k]=Math.round(v/p.step)*p.step}buildParams();draw()};choose('quadratic')})();
</script></body></html>
