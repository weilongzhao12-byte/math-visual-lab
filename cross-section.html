<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>空间截面探索器 V2</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d8e1eb;--accent:#2563eb;--shadow:0 8px 26px rgba(18,38,65,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-weight:650;color:var(--text);cursor:pointer;touch-action:manipulation}button.primary,button.active{background:var(--accent);color:#fff;border-color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}.page{min-height:100vh;padding:10px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.side{padding:16px;overflow:auto}.stage{min-height:650px;padding:10px}.back{display:inline-block;text-decoration:none;color:var(--accent);font-size:12px;font-weight:700;margin-bottom:10px}.title{font-size:20px;margin:0 0 5px}.sub,.note{font-size:11px;line-height:1.65;color:var(--muted)}.section{margin-top:15px}.section h2{font-size:13px;margin:0 0 8px}.field{margin:9px 0}.fh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.fh span{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:9px;border:1px solid var(--line);border-radius:11px;background:#f9fbfd}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}.note{border:1px solid #edf1f5;background:#f8fafc;border-radius:10px;padding:8px;margin-top:10px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px;height:100%}.threewrap{position:relative;min-height:620px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f8fbff}.three{position:absolute;inset:0}.three canvas{width:100%!important;height:100%!important;display:block;touch-action:none}.overlay{position:absolute;left:10px;top:10px;z-index:5;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10.5px;color:var(--muted);pointer-events:none}.right{padding:10px;border:1px solid var(--line);border-radius:12px}.right h3{font-size:13px;margin:0 0 8px}#section2d{width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:#fbfdff}.metric{font-size:12px;margin-top:7px}.metric b{font-size:16px}@media(max-width:980px){.page{grid-template-columns:245px 1fr}.workspace{grid-template-columns:1fr}.threewrap{min-height:520px}.right{display:grid;grid-template-columns:260px 1fr;gap:10px;align-items:start}}@media(max-width:720px){.page{display:flex;flex-direction:column;padding:8px}.stage{order:1;min-height:0}.side{order:2}.workspace{display:block}.threewrap{min-height:470px}.right{display:block;margin-top:8px}.grid2{grid-template-columns:1fr 1fr}button{min-height:44px}}
</style></head><body><div class="page"><aside class="panel side"><a class="back" href="./index.html">← 返回实验室</a><h1 class="title">空间截面探索器</h1><div class="sub">V2 修正了原先“Y 倾角不明显”的问题。现在两个倾斜量分别控制截面在两个水平方向上的坡度，任一滑杆单独改变都会真实改变截面。</div>
<div class="section"><h2>截面平面</h2><div class="field"><div class="fh"><b>X 方向倾斜</b><span id="txText">25°</span></div><input id="tx" type="range" min="-70" max="70" value="25"></div><div class="field"><div class="fh"><b>Y 方向倾斜</b><span id="tyText">30°</span></div><input id="ty" type="range" min="-70" max="70" value="30"></div><div class="field"><div class="fh"><b>平面位置</b><span id="offText">0.00</span></div><input id="off" type="range" min="-2.3" max="2.3" step="0.01" value="0"></div></div>
<div class="section"><h2>空间观察视角</h2><div class="field"><div class="fh"><b>水平视角</b><span id="yawText">40°</span></div><input id="yaw" type="range" min="-180" max="180" step="1" value="40"></div><div class="field"><div class="fh"><b>俯仰视角</b><span id="pitchText">28°</span></div><input id="pitch" type="range" min="-75" max="80" step="1" value="28"></div><div class="grid2"><button id="iso">立体视角</button><button id="front">正视</button><button id="right">侧视</button><button id="top">俯视</button></div></div>
<div class="section"><h2>快捷截面</h2><div class="grid2"><button id="horizontal">水平截</button><button id="diagonal">典型斜截</button><button id="random">随机截面</button><button id="center">过中心</button></div></div>
<div class="stats"><div class="stat"><b id="shape">—</b><span>截面形状</span></div><div class="stat"><b id="sides">—</b><span>截面边数</span></div></div><div class="note">3D 区仍可直接鼠标/手指拖动旋转视角；左侧两个“空间观察视角”滑杆提供更精确、可复现的观察角度。</div></aside>
<section class="panel stage"><div class="workspace"><div class="threewrap"><div class="overlay">拖动：旋转视角 · 滚轮/双指：缩放</div><div id="three" class="three"></div></div><div class="right"><div><h3>二维真实截面</h3><canvas id="section2d" width="560" height="560"></canvas></div><div><div class="metric">面积（相对单位）：<b id="area">—</b></div><div class="note">二维图自动正对截面平面，因此不会受到3D透视影响。你可以尝试找到三角形、四边形、五边形和六边形。</div></div></div></div></section></div>
<script src="./vendor/three.min.js"></script><script src="./vendor/OrbitControls.js"></script><script>
(()=>{const $=id=>document.getElementById(id),mount=$('three');const scene=new THREE.Scene();scene.background=new THREE.Color(0xf8fbff);const camera=new THREE.PerspectiveCamera(40,1,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));mount.appendChild(renderer.domElement);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=18;controls.target.set(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0xb7c2d2,1.1));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(6,8,7);scene.add(dl);
const cubeGeo=new THREE.BoxGeometry(3,3,3),cube=new THREE.Mesh(cubeGeo,new THREE.MeshPhongMaterial({color:0xdbeafe,transparent:true,opacity:.10,side:THREE.DoubleSide,depthWrite:false}));scene.add(cube);scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(cubeGeo),new THREE.LineBasicMaterial({color:0x1f2937})));const planeVisual=new THREE.Mesh(new THREE.PlaneGeometry(5.5,5.5),new THREE.MeshBasicMaterial({color:0xf59e0b,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false}));scene.add(planeVisual);let sectionMesh=null,sectionLine=null;
const verts=[];for(const x of[-1.5,1.5])for(const y of[-1.5,1.5])for(const z of[-1.5,1.5])verts.push(new THREE.Vector3(x,y,z));const pairs=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){let d=0;if(verts[i].x!==verts[j].x)d++;if(verts[i].y!==verts[j].y)d++;if(verts[i].z!==verts[j].z)d++;if(d===1)pairs.push([i,j])}
function planeData(){const tx=THREE.MathUtils.degToRad(+$('tx').value),ty=THREE.MathUtils.degToRad(+$('ty').value);const n=new THREE.Vector3(-Math.tan(tx),1,-Math.tan(ty)).normalize();return{n,off:+$('off').value}}
function uniq(ps){const o=[];for(const p of ps)if(!o.some(q=>q.distanceToSquared(p)<1e-8))o.push(p);return o}
function polygon(n,off){const pts=[];for(const[i,j]of pairs){const a=verts[i],b=verts[j],da=n.dot(a)-off,db=n.dot(b)-off;if(Math.abs(da)<1e-7)pts.push(a.clone());if(da*db<0){const t=da/(da-db);pts.push(a.clone().lerp(b,t))}}const p=uniq(pts);if(p.length<3)return p;const cen=new THREE.Vector3();p.forEach(v=>cen.add(v));cen.multiplyScalar(1/p.length);const ref=Math.abs(n.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(ref,n).normalize(),v=new THREE.Vector3().crossVectors(n,u).normalize();p.sort((a,b)=>Math.atan2(v.dot(a.clone().sub(cen)),u.dot(a.clone().sub(cen)))-Math.atan2(v.dot(b.clone().sub(cen)),u.dot(b.clone().sub(cen))));return p}
function geo(poly){const a=[];for(let i=1;i<poly.length-1;i++)a.push(...poly[0].toArray(),...poly[i].toArray(),...poly[i+1].toArray());const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();return g}
function project(poly,n){if(poly.length<3)return null;const cen=new THREE.Vector3();poly.forEach(p=>cen.add(p));cen.multiplyScalar(1/poly.length);const ref=Math.abs(n.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(ref,n).normalize(),v=new THREE.Vector3().crossVectors(n,u).normalize();const pts=poly.map(p=>[u.dot(p.clone().sub(cen)),v.dot(p.clone().sub(cen))]);let area=0;for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;area+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1]}return{pts,area:Math.abs(area)/2}}
function draw2d(d){const c=$('section2d'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,w,h);if(!d)return;let m=.2;d.pts.forEach(p=>m=Math.max(m,Math.abs(p[0]),Math.abs(p[1])));const s=.78*Math.min(w,h)/(2*m),cx=w/2,cy=h/2;ctx.beginPath();d.pts.forEach((p,i)=>{const x=cx+p[0]*s,y=cy-p[1]*s;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='#fde68a';ctx.fill();ctx.strokeStyle='#92400e';ctx.lineWidth=5;ctx.stroke();d.pts.forEach((p,i)=>{ctx.fillStyle='#92400e';ctx.beginPath();ctx.arc(cx+p[0]*s,cy-p[1]*s,7,0,Math.PI*2);ctx.fill();ctx.font='22px system-ui';ctx.fillText(String.fromCharCode(65+i),cx+p[0]*s+10,cy-p[1]*s-9)})}
function name(n){return({0:'无截面',3:'三角形',4:'四边形',5:'五边形',6:'六边形'})[n]||n+'边形'}
function updatePlane(){const{n,off}=planeData();$('txText').textContent=$('tx').value+'°';$('tyText').textContent=$('ty').value+'°';$('offText').textContent=off.toFixed(2);planeVisual.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),n);planeVisual.position.copy(n).multiplyScalar(off);const p=polygon(n,off);if(sectionMesh){scene.remove(sectionMesh);sectionMesh.geometry.dispose();sectionMesh.material.dispose()}if(sectionLine){scene.remove(sectionLine);sectionLine.geometry.dispose();sectionLine.material.dispose()}if(p.length>=3){sectionMesh=new THREE.Mesh(geo(p),new THREE.MeshBasicMaterial({color:0xf59e0b,transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false}));sectionMesh.renderOrder=2;scene.add(sectionMesh);sectionLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([...p,p[0]]),new THREE.LineBasicMaterial({color:0x92400e}));sectionLine.renderOrder=3;scene.add(sectionLine)}const d=project(p,n);$('shape').textContent=name(p.length);$('sides').textContent=p.length?p.length+' 边':'—';$('area').textContent=d?d.area.toFixed(3):'—';draw2d(d)}
function setView(yaw,pitch,dist=8){$('yaw').value=yaw;$('pitch').value=pitch;const yr=THREE.MathUtils.degToRad(yaw),pr=THREE.MathUtils.degToRad(pitch),cp=Math.cos(pr);camera.position.set(dist*Math.sin(yr)*cp,dist*Math.sin(pr),dist*Math.cos(yr)*cp);controls.target.set(0,0,0);controls.update();updateViewText()}
function updateViewText(){const p=camera.position.clone().sub(controls.target),r=p.length(),pitch=Math.asin(p.y/r),yaw=Math.atan2(p.x,p.z);$('yawText').textContent=Math.round(THREE.MathUtils.radToDeg(yaw))+'°';$('pitchText').textContent=Math.round(THREE.MathUtils.radToDeg(pitch))+'°'}
function sliderView(){const dist=camera.position.distanceTo(controls.target),yaw=THREE.MathUtils.degToRad(+$('yaw').value),pitch=THREE.MathUtils.degToRad(+$('pitch').value),cp=Math.cos(pitch);camera.position.set(dist*Math.sin(yaw)*cp,dist*Math.sin(pitch),dist*Math.cos(yaw)*cp);controls.update();$('yawText').textContent=$('yaw').value+'°';$('pitchText').textContent=$('pitch').value+'°'}
['tx','ty','off'].forEach(id=>$(id).addEventListener('input',updatePlane));['yaw','pitch'].forEach(id=>$(id).addEventListener('input',sliderView));controls.addEventListener('change',()=>{const p=camera.position.clone(),r=p.length();if(r){$('yaw').value=Math.round(THREE.MathUtils.radToDeg(Math.atan2(p.x,p.z)));$('pitch').value=Math.round(THREE.MathUtils.radToDeg(Math.asin(p.y/r)));updateViewText()}});$('horizontal').onclick=()=>{$('tx').value=0;$('ty').value=0;$('off').value=0;updatePlane()};$('diagonal').onclick=()=>{$('tx').value=35;$('ty').value=35;$('off').value=0;updatePlane()};$('random').onclick=()=>{$('tx').value=Math.round(Math.random()*110-55);$('ty').value=Math.round(Math.random()*110-55);$('off').value=(Math.random()*2.6-1.3).toFixed(2);updatePlane()};$('center').onclick=()=>{$('off').value=0;updatePlane()};$('iso').onclick=()=>setView(40,28);$('front').onclick=()=>setView(0,0);$('right').onclick=()=>setView(90,0);$('top').onclick=()=>setView(0,80);
function resize(){const r=mount.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);new ResizeObserver(resize).observe(mount);setView(40,28);updatePlane();function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)}loop()})();
</script></body></html>
