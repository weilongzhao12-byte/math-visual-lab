<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>单位圆与三角函数 V2</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d8e1eb;--accent:#2563eb;--shadow:0 8px 26px rgba(18,38,65,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-weight:650;color:var(--text);cursor:pointer}button.active,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}.page{min-height:100vh;padding:10px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.side{padding:16px}.stage{padding:12px;min-height:650px}.back{display:inline-block;text-decoration:none;color:var(--accent);font-size:12px;font-weight:700;margin-bottom:10px}.title{font-size:20px;margin:0 0 5px}.sub,.note{font-size:11px;line-height:1.6;color:var(--muted)}.big{font-size:28px;font-weight:850;text-align:center;padding:8px}.field{margin:10px 0}.fh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.curveBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.curveBtns button{font-size:11px;padding:7px 4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:9px;border:1px solid var(--line);border-radius:11px;background:#f9fbfd}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}.note{border:1px solid #edf1f5;background:#f8fafc;border-radius:10px;padding:8px;margin-top:10px}#uc{width:100%;height:auto;aspect-ratio:16/9;background:#fbfdff;border:1px solid var(--line);border-radius:12px;display:block}@media(max-width:760px){.page{display:flex;flex-direction:column;padding:8px}.stage{order:1;min-height:0}.side{order:2}button{min-height:44px}}
</style></head><body><div class="page"><aside class="panel side"><a class="back" href="./index.html">← 返回实验室</a><h1 class="title">单位圆与三角函数</h1><div class="sub">V2 同时展示正弦、余弦、正切的几何意义和函数图像。正切在 90° 与 270° 附近会出现无界增长。</div><div class="big" id="angleText">30°</div><div class="field"><div class="fh"><b>角度 θ</b><span>0°–360°</span></div><input id="angle" type="range" min="0" max="360" step="1" value="30"></div><div class="grid2"><button id="play" class="primary">▶ 自动转动</button><button id="reset">回到 0°</button></div><div class="curveBtns"><button data-curve="sin" class="active">正弦 sin</button><button data-curve="cos" class="active">余弦 cos</button><button data-curve="tan">正切 tan</button></div><div class="stats"><div class="stat"><b id="sinv">0.500</b><span>sin θ</span></div><div class="stat"><b id="cosv">0.866</b><span>cos θ</span></div><div class="stat"><b id="tanv">0.577</b><span>tan θ</span></div><div class="stat"><b id="quad">第一象限</b><span>所在象限</span></div></div><div class="note">单位圆中：P 点纵坐标对应 sinθ，横坐标对应 cosθ；从原点射线与 x=1 的切线交点高度对应 tanθ。</div></aside><section class="panel stage"><canvas id="uc" width="1280" height="720"></canvas></section></div><script>
(()=>{const c=document.getElementById('uc'),ctx=c.getContext('2d'),sl=document.getElementById('angle');let timer=null;const visible={sin:true,cos:true,tan:false};function quadrant(d){if([0,90,180,270,360].includes(d))return'坐标轴上';if(d<90)return'第一象限';if(d<180)return'第二象限';if(d<270)return'第三象限';return'第四象限'}function line(x1,y1,x2,y2,color,w=3,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}function drawCurve(fn,color,gx,gy,gw,scale,breakFn){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();let started=false;for(let d=0;d<=360;d++){const yv=fn(d*Math.PI/180);const bad=!Number.isFinite(yv)||Math.abs(yv)>3.2||(breakFn&&breakFn(d));const x=gx+d/360*gw,y=gy-yv*scale;if(bad){started=false;continue}if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)}ctx.stroke();ctx.restore()}
function draw(){const deg=+sl.value,rad=deg*Math.PI/180,s=Math.sin(rad),co=Math.cos(rad),tan=Math.abs(co)<1e-7?null:Math.tan(rad);document.getElementById('angleText').textContent=deg+'°';document.getElementById('sinv').textContent=s.toFixed(3);document.getElementById('cosv').textContent=co.toFixed(3);document.getElementById('tanv').textContent=tan===null?'未定义':Math.abs(tan)>99?(tan>0?'> 99':'< -99'):tan.toFixed(3);document.getElementById('quad').textContent=quadrant(deg);ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,c.width,c.height);
const cx=300,cy=360,R=220;line(cx-R-45,cy,cx+R+90,cy,'#cbd5e1',2);line(cx,cy-R-45,cx,cy+R+45,'#cbd5e1',2);ctx.strokeStyle='#334155';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();const px=cx+co*R,py=cy-s*R;line(cx,cy,px,py,'#2563eb',5);line(px,py,px,cy,'#16a34a',3,[8,8]);line(px,py,cx,py,'#f59e0b',3,[8,8]);ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();ctx.font='21px system-ui';ctx.fillStyle='#334155';ctx.fillText('P',px+12,py-8);ctx.fillStyle='#16a34a';ctx.fillText('cos θ',cx+(co*R)/2-28,cy+27);ctx.fillStyle='#b45309';ctx.fillText('sin θ',cx+8,cy-(s*R)/2);
// tangent geometry at x=1
const tx=cx+R;line(tx,cy-R-55,tx,cy+R+55,'#a855f7',2,[7,7]);if(tan!==null&&Math.abs(tan)<=1.6){const ty=cy-tan*R;line(cx,cy,tx,ty,'#7c3aed',2);ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.arc(tx,ty,7,0,Math.PI*2);ctx.fill();ctx.fillText('tan θ',tx+10,ty)}
const gx=620,gy=360,gw=600,scale=170;line(gx,gy,gx+gw,gy,'#cbd5e1',2);line(gx,gy-scale-75,gx,gy+scale+75,'#cbd5e1',2);if(visible.sin)drawCurve(Math.sin,'#2563eb',gx,gy,gw,scale);if(visible.cos)drawCurve(Math.cos,'#16a34a',gx,gy,gw,scale);if(visible.tan)drawCurve(Math.tan,'#7c3aed',gx,gy,gw,scale*0.62,d=>Math.abs((d%180)-90)<3);const qx=gx+deg/360*gw;ctx.setLineDash([6,7]);ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(qx,gy-scale-80);ctx.lineTo(qx,gy+scale+80);ctx.stroke();ctx.setLineDash([]);function dot(y,color){if(Number.isFinite(y)&&Math.abs(y)<3){ctx.fillStyle=color;ctx.beginPath();ctx.arc(qx,gy-y*scale*(color==='#7c3aed'?.62:1),7,0,Math.PI*2);ctx.fill()}}if(visible.sin)dot(s,'#2563eb');if(visible.cos)dot(co,'#16a34a');if(visible.tan&&tan!==null&&Math.abs(tan)<3)dot(tan,'#7c3aed');ctx.fillStyle='#475569';ctx.font='18px system-ui';ctx.fillText('0°',gx-5,gy+28);ctx.fillText('90°',gx+gw*.25-20,gy+28);ctx.fillText('180°',gx+gw*.5-25,gy+28);ctx.fillText('270°',gx+gw*.75-25,gy+28);ctx.fillText('360°',gx+gw-40,gy+28);let ly=85;if(visible.sin){ctx.fillStyle='#2563eb';ctx.fillText('sin θ',gx+15,ly);ly+=28}if(visible.cos){ctx.fillStyle='#16a34a';ctx.fillText('cos θ',gx+15,ly);ly+=28}if(visible.tan){ctx.fillStyle='#7c3aed';ctx.fillText('tan θ',gx+15,ly)}}
sl.addEventListener('input',draw);document.querySelectorAll('[data-curve]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.curve;visible[k]=!visible[k];b.classList.toggle('active',visible[k]);draw()}));document.getElementById('reset').onclick=()=>{sl.value=0;draw()};document.getElementById('play').onclick=()=>{const b=document.getElementById('play');if(timer){clearInterval(timer);timer=null;b.textContent='▶ 自动转动'}else{b.textContent='Ⅱ 暂停';timer=setInterval(()=>{sl.value=(+sl.value+2)%361;draw()},40)}};draw()})();
</script></body></html>
